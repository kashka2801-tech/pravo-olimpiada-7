  summary:['Правоспособность — с рождения; полная дееспособность — с 18 лет (или раньше: брак, эмансипация).','6–14: мелкие бытовые сделки; 14–18: заработок, стипендия, вклады.','Вред: до 14 — родители, 14–18 — сам, при нехватке средств — родители.','Истец подаёт иск, ответчик отвечает, суд выносит решение.']},

family: {

    ['Брак','добровольный союз мужчины и женщины, зарегистрированный в органах ЗАГС; брачный возраст — 18 лет, по уважительным причинам может быть снижен до 16 лет органом местного самоуправления.'],
    ['Совместная и личная собственность','нажитое в браке — совместное; полученное в дар, по наследству или принадлежавшее до брака — личное (ст. 34, 36 СК).'],

    ['Трудовой договор','соглашение работника и работодателя; по общему правилу заключается с 16 лет.'],

  table:'ages',

    ['Ночная, сверхурочная работа, командировки, совместительство подросткам запрещены','защищают здоровье и учёбу','частая «ловушка» в заданиях с несколькими ответами'],

crim: {

    ['Крайняя необходимость','устранение опасности причинением вреда третьим лицам, если иначе её не устранить и причинённый вред меньше предотвращённого (ст. 39 УК).'],
    ['Соучастники','исполнитель, организатор, подстрекатель, пособник.'],
    ['Административный арест','самое строгое административное наказание; не назначается лицам до 18 лет, беременным, женщинам с детьми до 14 лет и некоторым другим.']],
  table:'theft',
  sfv:[

    ['Конфискация имущества — не наказание','это «иная мера уголовно-правового характера»','в списке наказаний ст. 44 УК её нет'],

  example:{q:'15-летний подросток, угрожая ножом, отобрал у сверстника телефон. Какое преступление и наступает ли ответственность?',

  memo:'«Кража — тихо, грабёж — лихо, разбой — с ножом, мошенник — с враньём». Вина: прямой умысел — «хотел», косвенный — «допускал», легкомыслие — «надеялся пронесёт», небрежность — «не подумал, а должен был».',
  advanced:'Повышенный уровень: категории преступлений (ст. 15 УК) — небольшой тяжести, средней тяжести, тяжкие и особо тяжкие. Суд с участием присяжных заседателей рассматривает только уголовные дела. Не вступившее в силу решение обжалуют в апелляции, вступившее — в кассации.',

intl: {
  idea:'Международное право регулирует отношения между государствами и международными организациями. Его главные документы о правах человека — Всеобщая декларация прав человека (1948), международные пакты (1966), Конвенция о правах ребёнка (1989). Международное гуманитарное право защищает людей во время вооружённых конфликтов. По Конституции РФ общепризнанные принципы и нормы международного права и международные договоры России — часть её правовой системы (ст. 15 ч. 4).',
  terms:[
    ['Ратификация','утверждение международного договора высшим органом государства; в России — федеральным законом.'],
    ['Агреман','согласие государства принять конкретного человека в качестве посла.'],
    ['Персона нон грата','дипломат, которого принимающее государство объявило нежелательным.'],
    ['Апатрид и бипатрид','апатрид — лицо без гражданства; бипатрид — человек с двумя гражданствами.'],
    ['Беженец','человек, покинувший свою страну из-за обоснованных опасений преследования.'],
    ['Международное гуманитарное право','нормы, ограничивающие методы войны и защищающие раненых, пленных, мирных жителей (Женевские конвенции).']],
  table:'intl',
  sfv:[
    ['Совет Безопасности ООН: 15 членов, 5 постоянных (Россия, США, Китай, Великобритания, Франция)','у постоянных членов есть право вето','решения по вопросам мира и безопасности'],
    ['Международный суд ООН — в Гааге','рассматривает споры между государствами','граждане туда обращаться не могут'],
    ['Гражданин РФ не может быть выдан другому государству (ст. 61)','его могут судить в России','частая ловушка в заданиях']],
  example:{q:'В каком году и где была принята Всеобщая декларация прав человека?',
    a:'10 декабря 1948 года её приняла Генеральная Ассамблея ООН (в Париже). Поэтому 10 декабря отмечается День прав человека. Декларация — это резолюция, а не договор, но она стала основой для пактов 1966 года и многих конституций.'},

  memo:'Даты-«лесенка»: 1864 (Женевская конвенция) → 1919 (МОТ) → 1945 (ООН) → 1948 (Декларация) → 1966 (Пакты) → 1989 (Конвенция о правах ребёнка). Города: Нью-Йорк — ООН, Гаага — суд, Женева — Красный Крест.',
  advanced:'Повышенный уровень: в 1922 году по инициативе Фритьофа Нансена (Лига Наций) введён «нансеновский паспорт» — удостоверение личности для беженцев и апатридов. Гуго Гроций в трактате «О праве войны и мира» (1625) заложил основы науки международного права.',

const STRATEGIES = [
 {id:'s1', title:'Решать правовую задачу (казус) по схеме',
  algo:['Выпиши факты: кто, сколько лет, что сделал, что случилось.','Сформулируй правовой вопрос: «Наступает ли ответственность?», «Действительна ли сделка?».','Найди норму: какая отрасль права и какое правило.','Примени норму к фактам.','Запиши вывод одной фразой и, если можешь, назови статью или закон.'],
  ex:{q:'13-летняя Вера купила на карманные деньги шоколадку. Действительна ли сделка?',a:'Факты: 13 лет, покупка шоколадки на карманные деньги. Вопрос: может ли малолетняя совершить сделку? Норма: с 6 до 14 лет можно совершать мелкие бытовые сделки (ст. 28 ГК). Применение: шоколадка — мелкая бытовая покупка. Вывод: сделка действительна.'},
  task:'cr4'},
 {id:'s2', title:'Возраст — первый ключ',

 {id:'s3', title:'Кто принимает решение: орган власти',

 {id:'s4', title:'Исключать неверные варианты',

  return {v:1, setup:false, time:60, hard:[], startDiag:true, route:[], cnt:0, att:[], err:{}, rq:[],
    cards:{}, les:{}, diag:{i:0, ans:{}, done:false, res:null}, sess:null, mock:null, mockHist:[],
    past:{text:'', topics:[], use:false}, stratDone:false, finalDone:false, view:'home'};
}
let S;
try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || 'null') || {}); } catch (e) { S = fresh(); }
let storageOK = true;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; } }

// ===== ПОМОЩНИКИ =====
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(str) { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function seeded(arr, seed) { const a = arr.slice(); let s = hash(seed) || 1; for (let i = a.length - 1; i > 0; i--) { s = (Math.imul(s, 1103515245) + 12345) >>> 0; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function el(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function focusInto(node) { if (!node) return; node.setAttribute('tabindex', '-1'); node.scrollIntoView({behavior: 'smooth', block: 'start'}); setTimeout(() => node.focus({preventScroll: true}), 250); }
function plural(n, a, b, c) { const m = n % 10, mm = n % 100; return (m === 1 && mm !== 11) ? a : (m >= 2 && m <= 4 && (mm < 10 || mm >= 20)) ? b : c; }

function modal(text, okLabel, onOk, cancelLabel = 'Отмена') {
  const m = el(`<div class="modal-bg" role="dialog" aria-modal="true"><div class="modal"><p>${text}</p><div class="row"><button class="btn ghost" data-x>${cancelLabel}</button><button class="btn ${okLabel.includes('Сбросить') ? 'danger' : 'primary'}" data-ok>${okLabel}</button></div></div></div>`);
  document.body.appendChild(m);
  m.querySelector('[data-x]').onclick = () => m.remove();
  m.querySelector('[data-ok]').onclick = () => { m.remove(); onOk(); };
  m.querySelector('[data-ok]').focus();
}

// ===== ОЦЕНИВАНИЕ =====
function blank(q) {
  if (q.f === 'multi') return [];
  if (q.f === 'match') return q.left.map(() => -1);
  if (q.f === 'order') return [];
  if (q.f === 'open') return {text: '', checks: [], stage: 0};
  return null;
}
function answered(q, a) {
  if (a == null) return false;
  if (q.f === 'multi') return true; // 0 верных тоже допустимый ответ, но требуем явного «Ответить»
  if (q.f === 'match') return a.every(x => x >= 0);
  if (q.f === 'order') return a.length === q.items.length;
  if (q.f === 'open') return a.stage === 2;
  return typeof a === 'number';
}
function grade(q, a) {
  if (q.f === 'single' || q.f === 'error') { const ok = a === q.a; return {ok, sc: ok ? 3 : 0, mx: 3}; }
  if (q.f === 'multi') {
    const ok = q.opts.every((_, i) => q.a.includes(i) === (a || []).includes(i));
    return {ok, sc: ok ? 3 : 0, mx: 3};
  }
  if (q.f === 'match') { let c = 0; q.a.forEach((r, i) => { if (a && a[i] === r) c++; }); return {ok: c === q.a.length, sc: c, mx: q.a.length}; }
  if (q.f === 'order') { const ok = !!a && a.length === q.items.length && a.every((x, i) => x === i); return {ok, sc: ok ? 3 : 0, mx: 3}; }
  if (q.f === 'open') { const k = (a && a.checks || []).filter(Boolean).length; const r = k / q.keys.length; return {ok: r >= 0.75, sc: Math.round(r * 100) / 100, mx: 1, self: true}; }
}

// ===== ЗАПИСЬ ПОПЫТОК И ПОВТОРНЫХ ПРОВЕРОК =====
function record(q, res, hint, mode) {
  S.cnt++;
  S.att.push({q: q.id, t: q.t, lv: q.lv, ok: res.ok, sc: res.sc, mx: res.mx, h: !!hint, self: !!res.self, m: mode, ts: Date.now()});
  if (S.att.length > 1500) S.att = S.att.slice(-1500);
  const e = S.err[q.id];
  if (!res.ok) {
    S.err[q.id] = {n: (e ? e.n : 0) + 1, ts: Date.now(), okAfter: 0, fixed: false};
    if (!S.rq.some(r => r.src === q.id)) S.rq.push({src: q.id, c: q.c, t: q.t, due: S.cnt + 4});
  } else if (e && !hint) {
    e.okAfter++; if (e.okAfter >= 2) e.fixed = true;
  }
  // похожий вопрос на то же понятие тоже засчитывается в исправление
  if (res.ok && !hint) Object.entries(S.err).forEach(([id, er]) => { if (id !== q.id && QMAP[id] && QMAP[id].c === q.c && !er.fixed) { er.okAfter++; if (er.okAfter >= 2) er.fixed = true; } });
  save();
}
function similar(q, exclude = []) {
  const recent = S.att.slice(-4).map(a => a.q);
  const pool = Q.filter(x => x.id !== q.id && !exclude.includes(x.id) && x.f !== 'open');
  return pool.find(x => x.c === q.c && !recent.includes(x.id))
      || shuffle(pool.filter(x => x.t === q.t && x.lv === q.lv && !recent.includes(x.id)))[0]
      || shuffle(pool.filter(x => x.t === q.t && !recent.includes(x.id)))[0] || null;
}
function easier(q, exclude = []) {
  const recent = S.att.slice(-6).map(a => a.q);
  const pool = Q.filter(x => x.t === q.t && x.id !== q.id && x.lv < Math.max(2, q.lv) && x.f !== 'open' && !exclude.includes(x.id));
  return pool.find(x => x.c === q.c && !recent.includes(x.id)) || shuffle(pool.filter(x => !recent.includes(x.id)))[0] || shuffle(pool)[0] || null;
}

// ===== УСВОЕНИЕ =====
function topicStats(t) {
  const at = S.att.filter(a => a.t === t);
  const n = at.length, last = at.slice(-6);
  const val = a => a.ok ? (a.h ? 0.5 : 1) : 0;
  const acc = last.length ? last.reduce((s, a) => s + val(a), 0) / last.length : 0;
  const okIds = new Set(at.filter(a => a.ok && !a.h).map(a => a.q));
  const high = at.some(a => a.ok && !a.h && a.lv >= 2);
  let st, cls;
  if (n === 0) { st = 'Не проверено'; cls = 'none'; }
  else if (n < 4) { st = `Мало данных (${n} ${plural(n, 'ответ', 'ответа', 'ответов')})`; cls = 'few'; }
  else if (acc >= 0.8 && okIds.size >= 3 && high) { st = 'Уверенно'; cls = 'good'; }
  else if (acc >= 0.5) { st = 'В процессе'; cls = 'mid'; }
  else { st = 'Нужно повторить'; cls = 'bad'; }
  return {n, acc, st, cls, okIds: okIds.size, total: Q.filter(q => q.t === t).length, open: Object.entries(S.err).filter(([id, e]) => !e.fixed && QMAP[id] && QMAP[id].t === t).length};
}
function weakTopics() {
  return TOPICS.map(t => ({t: t.id, s: topicStats(t.id), p: prio(t.id)})).sort((a, b) => {
    const rank = c => ({bad: 0, few: 1, none: 1, mid: 2, good: 3})[c];
    return rank(a.s.cls) - rank(b.s.cls) || b.p - a.p;
  }).map(x => x.t);
}

// ===== МАРШРУТ =====
function prio(t) {
  let p = TMAP[t].w;
  if (S.hard.includes(t)) p += 2;
  const r = S.diag.res && S.diag.res[t];
  if (r) { if (r.sc <= 0.5) p += 3; else if (r.sc < 2) p += 1.5; else p -= 2; }
  if (S.past.use && S.past.topics.includes(t)) p += 1;
  return p;
}
function buildRoute() {
  const T = S.time, steps = [];
  const keepDiag = S.route.find(s => s.k === 'diag');
  let b = T;
  if (S.startDiag) { const m = T <= 30 ? 10 : 12; steps.push({k: 'diag', min: m, done: keepDiag ? keepDiag.done : S.diag.done}); b -= m; }
  const fin = T <= 30 ? 5 : T <= 60 ? 8 : 10;
  const mock = T >= 120 ? 40 : 0, strat = T >= 180 ? 16 : T >= 120 ? 12 : 0, errs = T >= 120 ? 8 : 0, cards = T >= 60 ? 6 : 0, brk = T >= 180 ? 10 : 0;
  b -= fin + mock + strat + errs + cards + brk;
  const order = TOPICS.map(t => t.id).sort((x, y) => prio(y) - prio(x));
  const nL = Math.min(TOPICS.length, Math.floor(b / 7)); b -= nL * 7;
  const practice = [];
  while (b >= 5) { const m = Math.min(15, b); practice.push(m); b -= m; }
  const finMin = fin + b;
  const L = order.slice(0, nL).map(t => ({k: 'lesson', t, min: 7}));
  const out = steps.slice();
  L.forEach((s, i) => {
    out.push(s);
    if (i === 1 && strat) out.push({k: 'strat', min: strat});
    if (i === 2 && practice.length) out.push({k: 'practice', min: practice.shift()});
    if (i === 3 && brk) out.push({k: 'break', min: 5});
  });
  if (strat && nL < 2) out.push({k: 'strat', min: strat});
  practice.forEach(m => out.push({k: 'practice', min: m}));
  if (cards) out.push({k: 'cards', min: cards});
  if (brk) out.push({k: 'break', min: brk - (nL > 3 ? 5 : 0)});
  if (mock) out.push({k: 'mock', min: mock});
  if (errs) out.push({k: 'errors', min: errs});
  out.push({k: 'final', min: finMin});
  out.forEach((s, i) => { s.id = 's' + i; if (s.done === undefined) s.done = s.k === 'lesson' ? !!S.les[s.t] : false; });
  S.route = out.filter(s => s.min > 0); save();
}
function stepTitle(s) {
  return {diag: 'Диагностика: ' + DIAG.length + ' вопросов', lesson: 'Урок: ' + (TMAP[s.t] || {}).name, strat: 'Приёмы решения олимпиадных заданий', practice: 'Тренировка по слабым темам',
    cards: 'Карточки по слабым темам', break: 'Перерыв: встать, попить воды, отдохнуть глазам', mock: 'Пробная олимпиада (20 заданий)', errors: 'Работа над ошибками', final: 'Последнее повторение'}[s.k];
}
function markStep(k, t) { const s = S.route.find(x => x.k === k && (!t || x.t === t) && !x.done); if (s) { s.done = true; save(); } }
function openStep(s) {
  S.curStep = s.id; save();
  if (s.k === 'diag') return go('diag');
  if (s.k === 'lesson') return go('lesson', {t: s.t});
  if (s.k === 'strat') return go('strat');
  if (s.k === 'practice') return startSession('weak');
  if (s.k === 'cards') return go('cards', {deck: 'weak'});
  if (s.k === 'break') return go('break', {id: s.id, min: s.min});
  if (s.k === 'mock') return go('mock');
  if (s.k === 'errors') return go('errors');
  if (s.k === 'final') return go('final');
}
function continueWork() {
  if (!S.setup) return go('setup');
  if (S.mock && S.mock.active) return go('mock');
  if (S.sess && !S.sess.over) return go('practice');
  const s = S.route.find(x => !x.done);
  if (s) return openStep(s);
  go('final');
}

// ===== НАВИГАЦИЯ =====
const NAV = [['home', 'Главная'], ['lessons', 'Уроки'], ['train', 'Тренировка'], ['strat', 'Приёмы'], ['cards', 'Карточки'], ['errors', 'Ошибки'], ['mock', 'Пробная олимпиада'], ['final', 'Последнее повторение'], ['past', 'Задания прошлых лет'], ['about', 'Об источниках']];
let VP = {};
function go(view, params = {}) {
  S.view = view; VP = params; save();
  const main = $('#main'); main.innerHTML = '';
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view || (view === 'lesson' && b.dataset.v === 'lessons') || (view === 'practice' && b.dataset.v === 'train')));
  (VIEWS[view] || VIEWS.home)(main, params);
  window.scrollTo(0, 0);
  const h = main.querySelector('h1'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({preventScroll: true}); }
}

// ===== ВИДЖЕТ ЗАДАНИЯ =====
function figHTML(q) { return q.fig ? `<figure class="fig">${FIGS[q.fig]}</figure>` : ''; }
function qHead(q, extra = '') { return `<div class="qmeta"><span class="tag t-${q.t}">${TMAP[q.t].short}</span><span class="tag lv${q.lv}">${LV[q.lv]}</span><span class="tag fmt">${FMT[q.f]}</span>${extra}</div>`; }

function qWidget(q, o = {}) {
  // o: {mode:'practice'|'diag'|'mock'|'lesson', ans, onChange, onDone, label, noHint}
  const mode = o.mode || 'practice';
  let ans = o.ans !== undefined ? o.ans : blank(q), hint = false, done = false;
  const box = el(`<section class="q card" aria-label="Задание"></section>`);
  const shuffled = (q.f === 'single' || q.f === 'multi') ? seeded(q.opts.map((_, i) => i), q.id) : q.opts ? q.opts.map((_, i) => i) : null;
  const ordShuf = q.f === 'order' ? seeded(q.items.map((_, i) => i), q.id + 'o') : null;
  const leftOrder = q.f === 'match' ? seeded(q.left.map((_, i) => i), q.id + 'm') : null;

  function body() {
    let h = (o.label ? `<div class="qlabel">${o.label}</div>` : '') + qHead(q) + `<div class="qtext">${q.q}</div>` + figHTML(q);
    if (q.f === 'single' || q.f === 'error') {
      h += `<div class="opts" role="radiogroup">` + shuffled.map((i, k) => `<button type="button" class="opt ${ans === i ? 'sel' : ''}" role="radio" aria-checked="${ans === i}" data-i="${i}"><span class="mark">${q.f === 'error' ? (i + 1) : String.fromCharCode(1040 + (k > 4 ? k + 1 : k))}</span><span>${q.opts[i]}</span></button>`).join('') + `</div>`;
    } else if (q.f === 'multi') {
      h += `<p class="small muted">Верных может быть от 0 до ${q.opts.length}. Отметь все, которые считаешь верными.</p><div class="opts">` + shuffled.map(i => `<button type="button" class="opt chk ${ans.includes(i) ? 'sel' : ''}" role="checkbox" aria-checked="${ans.includes(i)}" data-i="${i}"><span class="mark">${ans.includes(i) ? '✓' : ''}</span><span>${q.opts[i]}</span></button>`).join('') + `</div>`;
    } else if (q.f === 'match') {
      h += `<div class="match">` + leftOrder.map(i => `<label class="mrow"><span class="ml">${q.left[i]}</span><select data-i="${i}"><option value="-1">— выбери —</option>${q.right.map((r, j) => `<option value="${j}" ${ans[i] === j ? 'selected' : ''}>${r}</option>`).join('')}</select></label>`).join('') + `</div>`;
    } else if (q.f === 'order') {
      h += `<p class="small muted">Нажимай на шаги в нужном порядке. Нажми на шаг в списке ниже, чтобы убрать его.</p><div class="pool">` + ordShuf.filter(i => !ans.includes(i)).map(i => `<button type="button" class="chip" data-add="${i}">${q.items[i]}</button>`).join('') + `</div><ol class="seq">` + ans.map(i => `<li><button type="button" class="chip on" data-rm="${i}">${q.items[i]}</button></li>`).join('') + `</ol>`;
    } else if (q.f === 'open') {
      h += `<label class="small muted" for="ta-${q.id}">Напиши ответ своими словами (2–4 предложения):</label><textarea id="ta-${q.id}" rows="4">${esc(ans.text)}</textarea>`;
      if (ans.stage >= 1) h += `<div class="selfcheck"><p><b>Эталон:</b> ${q.ref}</p><p><b>Отметь элементы, которые действительно есть в твоём ответе по смыслу</b> (не просто похожие слова):</p>` + q.keys.map((k, i) => `<label class="ck"><input type="checkbox" data-k="${i}" ${ans.checks[i] ? 'checked' : ''}> ${k}</label>`).join('') + `<p class="small muted">Это самопроверка: приложение не оценивает смысл текста автоматически.</p></div>`;
    }
    h += `<div class="qactions">`;
    if (mode === 'practice' || mode === 'lesson') {
      if (!o.noHint) h += `<button type="button" class="btn ghost" data-hint ${hint ? 'disabled' : ''}>${hint ? 'Подсказка открыта' : 'Подсказка'}</button>`;
      if (q.f === 'open') h += ans.stage === 0 ? `<button type="button" class="btn primary" data-cmp>Сравнить с эталоном</button>` : `<button type="button" class="btn primary" data-self>Оценить себя</button>`;
      else h += `<button type="button" class="btn primary" data-go>Ответить</button>`;
    } else if (mode === 'diag') {
      h += `<button type="button" class="btn primary" data-go>Ответить и дальше</button>`;
    }
    h += `</div>` + (hint ? `<div class="hint" role="note"><b>Подсказка:</b> ${q.hint}</div>` : '') + `<div class="fbslot"></div>`;
    return h;
  }
  function render() {
    if (done) return;
    box.innerHTML = body(); wire();
  }
  function changed() { if (o.onChange) o.onChange(ans); }
  function wire() {
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (q.f === 'multi') { ans = ans.includes(i) ? ans.filter(x => x !== i) : ans.concat(i); } else ans = i;
      changed(); render(); const nb = box.querySelector(`.opt[data-i="${i}"]`); nb && nb.focus();
    });
    box.querySelectorAll('select').forEach(s => s.onchange = () => { ans[+s.dataset.i] = +s.value; changed(); });
    box.querySelectorAll('[data-add]').forEach(b => b.onclick = () => { ans = ans.concat(+b.dataset.add); changed(); render(); });
    box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { ans = ans.filter(x => x !== +b.dataset.rm); changed(); render(); });
    const ta = box.querySelector('textarea'); if (ta) ta.oninput = () => { ans.text = ta.value; changed(); };
    box.querySelectorAll('[data-k]').forEach(c => c.onchange = () => { ans.checks[+c.dataset.k] = c.checked; changed(); });
    const hb = box.querySelector('[data-hint]'); if (hb) hb.onclick = () => { hint = true; render(); };
    const cmp = box.querySelector('[data-cmp]'); if (cmp) cmp.onclick = () => {
      if (ans.text.trim().length < 15) return warn('Сначала напиши хотя бы одно-два предложения — так самопроверка будет честной.');
      ans.stage = 1; ans.checks = q.keys.map(() => false); render(); focusInto(box.querySelector('.selfcheck'));
    };
    const sf = box.querySelector('[data-self]'); if (sf) sf.onclick = () => { ans.stage = 2; submit(); };
    const g = box.querySelector('[data-go]'); if (g) g.onclick = () => {
      if (q.f === 'single' || q.f === 'error') { if (ans == null) return warn('Выбери вариант ответа.'); }
      if (q.f === 'match' && !ans.every(x => x >= 0)) return warn('Выбери пару для каждой строки.');
      if (q.f === 'order' && ans.length !== q.items.length) return warn('Расставь все шаги.');
      submit();
    };
  }
  function warn(t) { const s = box.querySelector('.fbslot'); s.innerHTML = `<p class="warn" role="alert">${t}</p>`; }
  function submit() {
    const res = grade(q, ans);
    if (mode === 'diag') { done = true; o.onDone && o.onDone(ans, res); return; }
    record(q, res, hint, mode);
    done = true;
    box.querySelectorAll('button.opt, .chip, select, textarea, input, [data-go], [data-hint], [data-cmp], [data-self]').forEach(x => x.disabled = true);
    const fb = el(`<div class="fb ${res.ok ? 'ok' : 'no'}" role="status">${feedback(q, ans, res, hint)}</div>`);
    box.querySelector('.fbslot').replaceWith(fb);
    markOpts(box, q, ans);
    o.onDone && o.onDone(ans, res, fb);
    focusInto(fb);
  }
  render();
  return box;
}

function markOpts(box, q, ans) {
  if (q.f === 'single' || q.f === 'error' || q.f === 'multi') box.querySelectorAll('.opt').forEach(b => {
    const i = +b.dataset.i, right = q.f === 'multi' ? q.a.includes(i) : q.a === i, picked = q.f === 'multi' ? ans.includes(i) : ans === i;
    if (right) b.classList.add('right'); if (picked && !right) b.classList.add('wrong');
  });
}
function correctText(q) {
  if (q.f === 'single') return q.opts[q.a];
  if (q.f === 'error') return `утверждение ${q.a + 1}: «${q.opts[q.a]}»`;
  if (q.f === 'multi') return q.a.length ? q.a.map(i => '«' + q.opts[i] + '»').join(', ') : 'ни один вариант не верен';
  if (q.f === 'match') return '<ul>' + q.left.map((l, i) => `<li>${l} → ${q.right[q.a[i]]}</li>`).join('') + '</ul>';
  if (q.f === 'order') return '<ol>' + q.items.map(x => `<li>${x}</li>`).join('') + '</ol>';
  if (q.f === 'open') return q.ref;
}
function feedback(q, ans, res, hint) {
  let head;
  if (res.self) head = res.ok ? `Самопроверка: ${Math.round(res.sc * 100)}% ключевых элементов — хорошо.` : `Самопроверка: ${Math.round(res.sc * 100)}% ключевых элементов — допиши недостающее.`;
  else head = res.ok ? 'Верно.' : (res.sc > 0 ? `Частично верно (${res.sc} из ${res.mx} ${plural(res.mx, 'балла', 'баллов', 'баллов')}).` : 'Неверно.');
  if (hint) head += ' <span class="tag">решено с подсказкой</span>';
  let h = `<p class="fbhead">${head}</p><h4>1. Правильный ответ</h4><div>${correctText(q)}</div>`;
  if (q.steps) h += `<h4>2. Решение по шагам</h4><ol>${q.steps.map(s => `<li>${s}</li>`).join('')}</ol>`;
  if (Array.isArray(q.why)) {
    const items = q.why.map((w, i) => w ? `<li><b>${q.f === 'error' ? 'Утверждение ' + (i + 1) : '«' + q.opts[i] + '»'}</b>: ${w}</li>` : '').join('');
    h += `<h4>3. ${q.f === 'error' ? 'Остальные утверждения' : q.f === 'multi' ? 'Разбор каждого варианта' : 'Почему другие варианты не подходят'}</h4><ul>${items}</ul>`;
  } else if (q.why) h += `<h4>3. Где обычно ошибаются</h4><p>${q.why}</p>`;
  if (q.f === 'match' && !res.ok) h += `<p class="small">Твои ошибки: ${q.left.map((l, i) => ans[i] !== q.a[i] ? `${l} → ты выбрала «${q.right[ans[i]] || '—'}»` : '').filter(Boolean).join('; ')}.</p>`;
  if (q.f === 'order' && !res.ok) h += `<p class="small">Твой порядок: ${ans.map(i => q.items[i]).join(' → ')}.</p>`;
  h += `<h4>4. Что требовалось</h4><p>${q.need}</p><h4>5. Запомни</h4><p class="rem">${q.rem}</p>`;
  return h;
}

function finishDiag() {
  const D = S.diag, res = {};
  TOPICS.forEach(t => res[t.id] = {sc: 0, n: 0});
  DIAG.forEach(id => { const q = QMAP[id]; if (!(id in D.ans)) return; res[q.t].n++; const a = D.ans[id]; if (a == null) return; const g = grade(q, a); res[q.t].sc += g.ok ? 1 : g.sc / g.mx >= 0.5 ? 0.5 : 0; });
  D.res = res; D.done = true; D.i = DIAG.length;
  const s = S.route.find(x => x.k === 'diag'); if (s) s.done = true;
  buildRoute();
}
function diagResults(m) {

function startSession(kind, o = {}) {
  let ids = [], label;
  if (kind === 'weak') {
    const w = weakTopics().slice(0, 3); label = 'Слабые темы: ' + w.map(t => TMAP[t].short).join(', ');
    const used = new Set(S.att.filter(a => a.ok).map(a => a.q));
    w.forEach(t => { const pool = Q.filter(q => q.t === t && q.f !== 'open'); ids.push(...shuffle(pool.filter(q => !used.has(q.id))).concat(shuffle(pool.filter(q => used.has(q.id)))).slice(0, 3).map(q => q.id)); });
    ids = ids.slice(0, 8);
  } else if (kind === 'mix') {
    label = 'Смешанная тренировка'; ids = shuffle(Q.filter(q => q.f !== 'open')).slice(0, 10).map(q => q.id);
  } else if (kind === 'errors') {
    label = 'Повторение ошибок: сначала похожий вопрос, затем исходный';
    const errs = Object.entries(S.err).filter(([, e]) => !e.fixed).sort((a, b) => b[1].n - a[1].n).map(([id]) => id).filter(id => QMAP[id]);
    if (!errs.length) { modal('Неисправленных ошибок нет. Можно потренировать слабые темы.', 'К слабым темам', () => startSession('weak'), 'Закрыть'); return; }
    errs.slice(0, 6).forEach(id => { const s = similar(QMAP[id], ids); if (s && !ids.includes(s.id)) ids.push(s.id); ids.push(id); });
  } else {
    label = TMAP[o.t].name + (o.lv ? ' · ' + LV[o.lv] : '');
    ids = Q.filter(q => q.t === o.t && (!o.lv || q.lv === o.lv)).sort((a, b) => a.lv - b.lv).map(q => q.id);
  }
  S.sess = {kind, label, queue: [...new Set(ids)], i: 0, log: [], over: false, extra: []};
  save(); go('practice');
}
function nextInSession() {
  const s = S.sess;
  if (s.extra.length) return s.extra.shift();
  const due = S.rq.findIndex(r => r.due <= S.cnt && (s.kind !== 'topic' || r.t === (QMAP[s.queue[0]] || {}).t));
  if (due >= 0 && s.log.length >= 1) {
    const r = S.rq.splice(due, 1)[0]; const sim = similar(QMAP[r.src], s.log.map(x => x.q));
    if (sim) return {q: sim.id, tag: 'Повторная проверка: похожий вопрос на понятие, где была ошибка'};
  }
  while (s.i < s.queue.length) { const id = s.queue[s.i++]; if (!s.log.some(x => x.q === id)) return {q: id}; }
  return null;
}
VIEWS.practice = (m) => {
  const s = S.sess;
  if (!s) return go('train');
  if (!s.cur && !s.over) { s.cur = nextInSession(); if (!s.cur) s.over = true; save(); }
  if (s.over) {
    const ok = s.log.filter(x => x.ok).length;

function pickMock() {
  const w = id => TMAP[QMAP[id].t].w + (S.hard.includes(QMAP[id].t) ? 1 : 0);
  const take = (pool, n) => { const out = []; const p = shuffle(pool); const byT = {}; p.sort((a, b) => w(b.id) * Math.random() - w(a.id) * Math.random()); for (const q of p) { if (out.length >= n) break; if ((byT[q.t] || 0) >= Math.ceil(n / 4)) continue; byT[q.t] = (byT[q.t] || 0) + 1; out.push(q.id); } for (const q of p) { if (out.length >= n) break; if (!out.includes(q.id)) out.push(q.id); } return out; };
  const p1 = take(Q.filter(q => q.f === 'single'), 13).concat(take(Q.filter(q => q.f === 'error'), 2));
  const p2 = take(Q.filter(q => q.f === 'multi'), 4);
  const p3 = take(Q.filter(q => q.f === 'match' || q.f === 'order'), 1);
  return p1.concat(p2, p3);
}

  <button class="btn primary big" id="fd">Повторение завершено</button></div>`;

  $('#cd', m).onclick = () => go('cards', {deck: 'weak'});
  $('#fd', m).onclick = () => { S.finalDone = true; markStep('final'); save(); go('home'); };
};

VIEWS.past = (m) => {

  <ul><li><a href="https://tasks.olimpiada.ru/upload/files/tasks/87/2025/ans-law-7-mun-kryar-25-26.pdf" target="_blank" rel="noopener">Красноярский край, 7 класс (ответы)</a>: 120 минут, 100 баллов; один и несколько ответов (любая ошибка — 0), соответствие, историко-правовые задания, анаграммы (задаток, приговор, депутат), пропуски в статьях Конституции, аббревиатура МОТ, латынь ex officio, деятели и международные акты (Рерих, Дюнан, Нансен, Э. Рузвельт), задачи о фиктивном браке и об ответственности подростков, филворд.</li>
  <li><a href="https://vos.olimpiada.ru/upload/files/Arhive_tasks/2025-26/mun/law/ans-law-7-8-mun-msk-25-26.pdf" target="_blank" rel="noopener">Москва, 7–8 классы (ответы)</a>: формы вины, апатрид и бипатрид, монархия и республика, последовательности (приём на работу, принятие закона), расшифровка названий органов, верно/неверно, ребусы, анаграммы (вексель, гипотеза), ударения (договор, ходатайство, обеспечение), кроссворд.</li>
  <li><a href="https://tasks.olimpiada.ru/upload/files/tasks/87/2025/ans-law-7-8-mun-omsk-25-26.pdf" target="_blank" rel="noopener">Омская область, 7–8 классы (ответы)</a>: срок Президента, 450 депутатов, назначение председателя Верховного Суда, главы 1, 2, 9 Конституции, основания гражданских прав, ошибки в тексте о Правительстве, имущество супругов, ООН, Русская Правда.</li>

  const v = S.view === 'lesson' ? 'lessons' : (S.view === 'break' ? 'home' : S.view);
